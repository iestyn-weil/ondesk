function applyTeamsRuntimeConfig(){

  if(saved.payloadMode && ['adaptive-card','raw-json'].includes(saved.payloadMode)) CONFIG.TEAMS.PAYLOAD_MODE = saved.payloadMode;

  const upnParam=params.get('mentionUpn') || params.get('upn');
  const enabledParam=params.get('teamsEnabled');
  const sendModeParam=params.get('sendMode');
  const postModeParam=params.get('postMode');
  const patch={};
  if(urlParam) patch.webhookUrl=urlParam.trim();
  if(upnParam) patch.mentionUpn=upnParam.trim();
  if(enabledParam !== null) patch.enabled = !['0','false','no','off'].includes(enabledParam.toLowerCase());
  if(sendModeParam && ['manual','auto'].includes(sendModeParam)) patch.sendMode=sendModeParam;
  if(postModeParam && ['no-cors','cors'].includes(postModeParam)) patch.postMode=postModeParam;
  if(Object.keys(patch).length){

    if(stored.enabled !== undefined) CONFIG.TEAMS.ENABLED=!!stored.enabled;
    if(stored.webhookUrl) CONFIG.TEAMS.WEBHOOK_URL=stored.webhookUrl;

  }

function now(){ return CONFIG.DEMO_TIME_OVERRIDE ? new Date(CONFIG.DEMO_TIME_OVERRIDE) : new Date(); }
function pad2(n){ return String(n).padStart(2,'0'); }
function timeToMinutes(hhmm){ const m=String(hhmm||'').match(/(\d{1,2})\D(\d{2})/); return m ? Number(m[1])*60+Number(m[2]) : 0; }
function minutesToTime(min){ min=Math.max(0, Math.min(24*60-1, min)); return `${pad2(Math.floor(min/60))}:${pad2(min%60)}`; }
function nowMinutes(){ const n=now(); return n.getHours()*60+n.getMinutes(); }

function escapeHTML(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function hashCode(s){ let h=0; for(let i=0;i<s.length;i++){ h=((h<<5)-h)+s.charCodeAt(i); h|=0; } return Math.abs(h).toString(36).toUpperCase(); }
function matchStatus(keyword){ const k=clean(keyword).toLowerCase(); for(const s of STATUS_TYPES) if(s.keys.includes(k)) return s; return {cls:'b-tag', icon:'tag', label:keyword}; }

function parseCSV(text){
  const sep = text.includes('\t') && !text.includes(',') ? '\t' : ',';
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if(!lines.length) return [];
  const headers = splitRow(lines[0], sep).map(h=>h.trim().replace(/^\uFEFF/,''));
  return lines.slice(1).map(line => {
    const cells = splitRow(line, sep); const obj={}; headers.forEach((h,i)=>obj[h]=(cells[i]||'').trim()); return obj;
  });
}
function splitRow(line, sep){ const out=[]; let cur='', inQ=false; for(let i=0;i<line.length;i++){ const c=line[i]; if(c==='"' && line[i+1]==='"'){cur+='"'; i++;} else if(c==='"') inQ=!inQ; else if(c===sep && !inQ){out.push(cur); cur='';} else cur+=c; } out.push(cur); return out; }
function isPlanOnRows(rows){ if(!rows.length) return false; const keys=Object.keys(rows[0]); return keys.includes('Booking No.') && keys.includes('Order No.') && keys.includes('Team') && keys.includes('Facility'); }
function baseBookingId(row){ const booking=clean(row['Booking No.']); if(booking) return booking; const order=clean(row['Order No.']); if(order){ const m=order.match(/^(\d+)(?:\.\d+)?/); return m ? `${m[1]}.00` : order; } return ''; }
function cleanPlanOnComment(s){ return clean(s).replace(/<\s*BR\s*\/?>/ig,' · ').replace(/\s+/g,' ').replace(/\s+·\s+/g,' · '); }
function looksLikeRoom(s){ return /^\s*(CR\s*-\s*)?\d+\.\d+\s*$/i.test(s || ''); }
function firstNonBlank(rows, field){ const r=rows.find(x=>clean(x[field])); return r ? clean(r[field]) : ''; }
function normaliseRoom(room){ return clean(room).replace(/^CR\s*-\s*/i,''); }
function isClientFloor(room){ return /^8\./.test(normaliseRoom(room)); }
function consolidatePlanOnRows(rows){
  const byId = new Map();
  rows.forEach(row => { const id=baseBookingId(row); if(!id) return; if(!byId.has(id)) byId.set(id, []); byId.get(id).push(row); });
  const meetings=[];
  byId.forEach((group, id) => {
    const avRows = group.filter(r => clean(r.Team).toLowerCase() === 'av / office equipment');
    if(!avRows.length) return;
    const chosen = avRows[0];
    const start = firstNonBlank(avRows,'Start') || firstNonBlank(group,'Start');
    const end = firstNonBlank(avRows,'End') || firstNonBlank(group,'End');
    let room = firstNonBlank(avRows,'Room') || firstNonBlank(group,'Room');
    if(!room){ const roomFacility = group.map(r=>clean(r.Facility)).find(looksLikeRoom); room = roomFacility || ''; }
    const title = firstNonBlank(avRows,'Title') || firstNonBlank(group,'Title') || firstNonBlank(group,'Task Type');
    const host = firstNonBlank(avRows,'Host') || firstNonBlank(group,'Host') || '—';
    const facilities = [...new Set(avRows.map(r=>clean(r.Facility)).filter(Boolean).filter(f => !looksLikeRoom(f)))];
    const req = facilities.length ? facilities.join(' · ') : 'AV support';
    const comments = cleanPlanOnComment(firstNonBlank(avRows,'Booking Comments') || firstNonBlank(group,'Booking Comments'));
    const hasZoom = /zoom/i.test(req + ' ' + comments + ' ' + title);
    const orderIds = [...new Set(group.map(r=>clean(r['Order No.'])).filter(Boolean))].join(', ');
    meetings.push(normaliseMeeting({
      MeetingID: 'PLANON-' + id,
      SourceSystem: 'PlanOn CSV',
      SourceBookingID: id,
      SourceOrderIDs: orderIds,
      Start: start,
      End: end,
      Room: room,
      Host: host,
      Title: title,
      Requirements: req,
      ZoomDetails: hasZoom ? comments : '',
      HasZoomDetails: hasZoom,
      AllocatedTo: '',
      CurrentStage: 'allocated'
    }));
  });
  return meetings.sort((a,b)=>timeToMinutes(a.Start)-timeToMinutes(b.Start) || String(a.Room).localeCompare(String(b.Room)));
}
function normaliseMeetings(rows){ return isPlanOnRows(rows) ? consolidatePlanOnRows(rows) : rows.map(normaliseMeeting); }
function normaliseStage(v, attended, allocated){
  const raw=clean(v).toLowerCase().replace(/[\s_-]+/g,'');
  if(['completed','complete','done','attended','true','yes','y','1','x','✓'].includes(raw) || attended === true) return 'completed';
  if(['onsite','inroom','joined','attending'].includes(raw)) return 'onsite';
  if(['ack','acknowledged','handling'].includes(raw)) return 'acknowledged';
  return 'allocated';
}
function normaliseMeeting(m){

async function fetchCSV(url){ const res = await fetch(url,{cache:'no-store'}); if(!res.ok) throw new Error(url + ' HTTP ' + res.status); return parseCSV(await res.text()); }
async function loadData(){

function todayStatusRows(){ return state.status.filter(r => !clean(r.Date) || clean(r.Date) === todayISO()); }

function stageIndex(stage){ return STAGE_INDEX[stage] ?? 0; }
function getSla(m){
  const start=timeToMinutes(m.Start); const desk=deskStartMinutes();

  const ackOpenAdjusted=ackRaw<desk; const onsiteOpenAdjusted=onsiteRaw<desk;
  return {
    ackDue: Math.max(ackRaw, desk),
    ackAlert: Math.max(ackRaw, desk) + (ackOpenAdjusted ? CONFIG.STARTUP_GRACE_MINUTES : 0),
    onsiteDue: Math.max(onsiteRaw, desk),
    onsiteAlert: Math.max(onsiteRaw, desk) + (onsiteOpenAdjusted ? CONFIG.STARTUP_GRACE_MINUTES : 0),
    completeDue: start + CONFIG.SLA.COMPLETE_AFTER_START_MINUTES,

}
function requiredAlertForMeeting(m){

  if(nm >= sla.onsiteAlert && si < STAGE_INDEX.onsite) return {rule:'ONSITE_OVERDUE', severity:'high', requiredStage:'In Room / Joined', due:sla.onsiteDue, label:'On site due'};
  if(nm >= sla.ackAlert && si < STAGE_INDEX.acknowledged) return {rule:'ACK_OVERDUE', severity:'medium', requiredStage:'Acknowledged', due:sla.ackDue, label:'Ack due'};
  return null;
}

}
function meetingVisual(m, isNext){

  if(alert) return {row:alert.severity==='high'?'overdue':'at-risk', pill:alert.severity==='high'?'sp-bad':'sp-risk', label:alert.rule==='ACK_OVERDUE'?'ACK DUE':alert.rule==='ONSITE_OVERDUE'?'ON SITE DUE':'DONE DUE'};

function findNextMeetingIndex(meetings){ const nm=nowMinutes(); let bi=-1, bs=Infinity; meetings.forEach((m,i)=>{ const s=timeToMinutes(m.Start); if(s>nm && s<bs){bs=s; bi=i;} }); return bi; }

async function sendTeamsAlert(alert, manual){

  if(sent && !manual && (Date.now()-new Date(sent).getTime()) < cooldownMs) return;
  if(!CONFIG.TEAMS.ENABLED || !CONFIG.TEAMS.WEBHOOK_URL){
    const configured=await ensureTeamsConfigured(manual);
    if(!configured){ recordAudit('TeamsAlertSkipped', m, 'Teams webhook is not configured/enabled.'); renderAlertStrip(); return; }
  }
  const payload=buildTeamsPayload(alert); let ok=false; let detail='';
  try{
    if(CONFIG.TEAMS.POST_MODE === 'no-cors'){
      await fetch(CONFIG.TEAMS.WEBHOOK_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:JSON.stringify(payload)});
      ok=true; detail='Teams alert POST sent fire-and-forget using Teams webhook Adaptive Card envelope. Browser cannot verify no-cors delivery; check Power Automate run history and Teams channel.';
    } else {
      const res=await fetch(CONFIG.TEAMS.WEBHOOK_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      ok=res.ok; detail=ok ? `Teams alert sent (${res.status}).` : `Teams webhook returned HTTP ${res.status}.`;
    }
  } catch(e){ detail='Teams alert failed: ' + e.message + '. If this is a GitHub-hosted direct test, the likely cause is browser CORS/preflight blocking by the Power Automate endpoint; use a relay/Azure API for production.'; }
  if(ok){ state.sentAlerts[alert.key]=new Date().toISOString(); recordAudit('TeamsAlertSent', m, detail); }
  else recordAudit('TeamsAlertFailed', m, detail);
  persistLocalState(); renderAll();
}

function setTheme(theme, updateURL){ document.body.classList.remove('theme-dark','theme-light','theme-contrast'); document.body.classList.add('theme-'+theme); const next=theme==='dark'?'light':theme==='light'?'contrast':'dark'; const icon=next==='light'?'sun':next==='contrast'?'contrast':'moon'; const btn=document.getElementById('theme-toggle'); if(btn) btn.innerHTML=svgIcon(icon,16); if(updateURL){ try{ const url=new URL(location.href); url.searchParams.set('theme', theme); history.replaceState(null,'',url); }catch(e){} } }
function applyURLTheme(){ const params=new URLSearchParams(location.search); const t=params.get('theme'); setTheme(['dark','light','contrast'].includes(t)?t:'dark', false); }
function toggleTheme(){ const cls=document.body.classList; const current=cls.contains('theme-light')?'light':cls.contains('theme-contrast')?'contrast':'dark'; const next=current==='dark'?'light':current==='light'?'contrast':'dark'; setTheme(next,true); }
async function dataRefresh(){ await loadData(); renderAll(); }
function stateRefresh(){ renderMeetings(); renderAlertStrip(); renderHeader(); maybeAutoSendAlerts(); }
function clockTick(){ renderHeader(); }
async function init(){
  applyTeamsRuntimeConfig();
  applyURLTheme(); applyURLView();
  document.getElementById('tab-meetings').innerHTML=svgIcon('clock',16)+' Meetings'; document.getElementById('tab-status').innerHTML=svgIcon('users',16)+' Status'; document.getElementById('tab-audit').innerHTML=svgIcon('audit',16)+' Audit';
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme); document.getElementById('teams-test').addEventListener('click', sendFirstDemoAlert);
  document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setActiveTab(b.dataset.tab)));
  await dataRefresh(); setInterval(clockTick,1000); setInterval(stateRefresh,CONFIG.STATE_REFRESH_MS); setInterval(dataRefresh,CONFIG.DATA_REFRESH_MS);
}
window.addEventListener('DOMContentLoaded', init);
window.addEventListener('message', (e)=>{ if(!e.data || typeof e.data !== 'object') return; if(e.data.tab) setActiveTab(e.data.tab); if(e.data.theme) setTheme(e.data.theme,false); });
</script>
